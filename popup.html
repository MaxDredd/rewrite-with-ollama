<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rewrite with Ollama</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-width: 480px;
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff; color: #1b1b1b;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .version { font-size: 11px; font-weight: 400; color: #888; margin-left: 6px; }
  .status { font-size: 12px; margin-bottom: 12px; min-height: 18px; color: #666; }
  .status.busy { color: #0b5fff; }
  .status.ok { color: #1a7f37; }
  .status.error { color: #c00; }
  label.field { display: block; font-weight: 600; margin: 10px 0 4px; }
  textarea {
    width: 100%; resize: vertical; padding: 8px;
    font: 13px/1.5 Consolas, "Courier New", monospace;
    border: 1px solid #ccc; border-radius: 6px;
    background: #fafafa; color: inherit;
  }
  textarea[readonly] { background: #f0f0f0; }
  .buttons { display: flex; gap: 8px; margin-top: 14px; }
  button {
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
    border: 1px solid #ccc; background: #f5f5f5; color: inherit;
  }
  button.primary { background: #0b5fff; border-color: #0b5fff; color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  details.settings { margin-top: 16px; border-top: 1px solid #ddd; padding-top: 8px; }
  details.settings summary { cursor: pointer; font-weight: 600; }
  details.settings label { display: block; margin: 8px 0 2px; font-size: 12px; }
  details.settings input {
    width: 100%; padding: 6px 8px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 6px; background: inherit; color: inherit;
  }
  details.settings input[type="range"] { padding: 0; }
  details.settings textarea { font-size: 13px; }
  .hint { font-size: 12px; color: #666; }
  #empty { padding: 24px 8px; text-align: center; color: #555; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #e8e8e8; }
    textarea { background: #2a2a2a; border-color: #555; }
    textarea[readonly] { background: #242424; }
    button { background: #2f2f2f; border-color: #555; }
    .status { color: #aaa; }
    .hint, #empty { color: #aaa; }
  }
</style>
</head>
<body>
  <h1>Rewrite with Ollama<span id="version" class="version"></span></h1>
  <div id="status" class="status">Ready</div>

  <div id="empty" hidden>
    <p id="emptyMsg">Select text on any webpage, right-click it, then choose <strong>Rewrite with Ollama</strong>.</p>
  </div>

  <main id="main" hidden>
    <label class="field" for="original">Original (read-only)</label>
    <textarea id="original" rows="6" readonly></textarea>

    <label class="field" for="rewritten">Rewritten (editable)</label>
    <textarea id="rewritten" rows="10" placeholder="Waiting for Ollama…"></textarea>

    <div class="buttons">
      <button id="apply" class="primary">Apply</button>
      <button id="regenerate">Regenerate</button>
      <button id="copy">Copy</button>
      <button id="cancel">Cancel</button>
    </div>
  </main>

  <details class="settings">
    <summary>Settings</summary>
    <label for="endpoint">Ollama endpoint</label>
    <input id="endpoint" type="text" spellcheck="false" autocomplete="off" />
    <label for="model">Model name (must match <code>ollama list</code> exactly)</label>
    <input id="model" type="text" spellcheck="false" autocomplete="off" />
    <label for="promptPrefix">Rewrite prompt (sent before the selected text)</label>
    <textarea id="promptPrefix" rows="3" spellcheck="false"></textarea>
    <label for="temperature">Temperature (creativity): <span id="tempValue">0.8</span></label>
    <input id="temperature" type="range" min="0" max="2" step="0.1" />
    <div class="buttons"><button id="saveSettings">Save settings</button></div>
    <p class="hint">If Ollama runs on another machine (e.g. over Tailscale), set the endpoint to that address, like <code>http://100.x.y.z:11434</code>.</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
